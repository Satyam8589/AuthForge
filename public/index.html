<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthForge - Authentication Testing Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="12" fill="url(#gradient)" />
                    <path d="M20 10L28 16V24L20 30L12 24V16L20 10Z" stroke="white" stroke-width="2" fill="none" />
                    <circle cx="20" cy="20" r="3" fill="white" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>AuthForge</h1>
            </div>
            <div class="user-status" id="userStatus">
                <span class="status-dot"></span>
                <span>Not Authenticated</span>
            </div>
        </header>

        <div class="dashboard">
            <!-- User Info Card -->
            <div class="card user-card" id="userCard" style="display: none;">
                <div class="card-header">
                    <h3>👤 User Profile</h3>
                    <button id="logoutBtn" class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
                        </svg>
                    </button>
                </div>
                <div class="user-info" id="userInfo"></div>
            </div>

            <!-- Auth Forms -->
            <div class="auth-section" id="authSection">
                <!-- Register Form -->
                <div class="card">
                    <div class="card-header">
                        <h3>📝 Register</h3>
                    </div>
                    <form id="registerForm" class="form">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="johndoe" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number"
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <span>Create Account</span>
                        </button>
                    </form>
                </div>

                <!-- Login Form -->
                <div class="card">
                    <div class="card-header">
                        <h3>🔐 Login</h3>
                    </div>
                    <form id="loginForm" class="form">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <span>Sign In</span>
                        </button>
                    </form>
                </div>

                <!-- Google OAuth -->
                <div class="card">
                    <div class="card-header">
                        <h3>🔑 Google OAuth</h3>
                    </div>
                    <div class="oauth-container">
                        <p class="oauth-description">Sign in or create an account with Google for quick and secure
                            authentication.</p>
                        <div class="oauth-buttons" style="display: flex; flex-direction: column; gap: 1rem;">
                            <button id="googleRegisterBtn" class="btn btn-google">
                                <svg width="18" height="18" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                    <path fill="currentColor"
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                    <path fill="currentColor"
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                    <path fill="currentColor"
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                                </svg>
                                <span>Continue with Google</span>
                            </button>
                            <button id="googleLoginBtn" class="btn btn-secondary">
                                <svg width="18" height="18" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                    <path fill="currentColor"
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                </svg>
                                <span>Login Only (Google)</span>
                            </button>
                        </div>
                        <p class="oauth-note">✨ 'Continue' works for both registration and login</p>
                    </div>
                </div>
            </div>

            <!-- Protected Actions -->
            <div class="card" id="protectedActions" style="display: none;">
                <div class="card-header">
                    <h3>🛡️ Protected Actions</h3>
                </div>
                <div class="actions-grid">
                    <button id="refreshTokenBtn" class="btn btn-secondary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path
                                d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                        </svg>
                        <span>Refresh Token</span>
                    </button>
                    <button id="logoutAllBtn" class="btn btn-secondary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        <span>Logout All Devices</span>
                    </button>
                </div>
            </div>

            <!-- Response Display -->
            <div class="card response-card">
                <div class="card-header">
                    <h3>📡 API Response</h3>
                    <button id="clearResponseBtn" class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <pre id="response" class="response-content">No response yet. Try an action above!</pre>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
